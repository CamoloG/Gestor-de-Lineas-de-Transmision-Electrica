<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Boyacá y Casanare - OpenStreetMap</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
          
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #e5e3df; 
            overflow: hidden;
        }
        #mapa {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="mapa"></div>

    <script>
        
        L.Browser.any3d = false;

        var mapa = L.map('mapa', {
            fadeAnimation: false,
            zoomAnimation: false,
            markerZoomAnimation: false
        }).setView([5.40, -72.40], 7);
        
        mapa.on('layeradd', function() 
        {
            var svg = document.querySelector('.leaflet-zoom-animated');
            if (svg && !document.getElementById('flecha-linea')) 
            {
                var defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
                defs.innerHTML = `
                    <marker id="flecha-linea" viewBox="0 0 10 10" refX="22" refY="5" 
                            markerWidth="8" markerHeight="8" orient="auto">
                        <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF5722" />
                    </marker>
                `;
                svg.appendChild(defs);
            }
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(mapa);

        if (typeof ResizeObserver !== 'undefined') {
            const resizeObserver = new ResizeObserver(function() {
                mapa.invalidateSize();
            });
            resizeObserver.observe(document.getElementById('mapa'));
        }

        var intentos = 0;
        var intervaloArranque = setInterval(function() {
            mapa.invalidateSize();
            intentos++;
            if (intentos > 15) {
                clearInterval(intervaloArranque); 
            }
        }, 200);
        
        var iconoVerde = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        function agregarPuntoDesdeJava(lat, lng, nombre, tipo) 
        {
            if (mapa) 
            {
                var esGenerador = tipo.toUpperCase() === "GENERADOR";
                var tipoTexto = esGenerador ? "Generador" : "Subestación";

                // Si es generador, le asignamos el icono verde. Si no, lo dejamos vacío para que use el azul por defecto
                var opcionesMarcador = esGenerador ? { icon: iconoVerde } : {};

                var marcador = L.marker([lat, lng], opcionesMarcador).addTo(mapa);

                marcador.bindPopup("<b>" + tipoTexto + ":</b><br>" + nombre);
            }
        }

        function agregarLineaDesdeJava(lat1, lng1, lat2, lng2, nombreLinea) {
            if (mapa) 
            {
                var linea = L.polyline([[lat1, lng1], [lat2, lng2]], {
                    color: '#FF5722', 
                    weight: 3,
                    opacity: 0.8
                }).addTo(mapa);
                
                linea.bindPopup("<b>Línea de Transmisión:</b><br>" + nombreLinea);

                if (linea._path) {
                    linea._path.setAttribute('marker-end', 'url(#flecha-linea)');
                }
            }
        }
        
        function limpiarMapa() 
        {
            if (mapa) {
                mapa.eachLayer(function (layer) 
                {
                    if (layer instanceof L.Marker || layer instanceof L.Polyline || (typeof L.PolylineDecorator !== 'undefined' && layer instanceof L.PolylineDecorator)) {
                        mapa.removeLayer(layer);
                    }
                });
            }
        }
    </script>

</body>
</html>
